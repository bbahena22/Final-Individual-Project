name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    # Opt into Node.js 24 for JavaScript actions to avoid Node 20 deprecation failures
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and build
        working-directory: ./my-app
        run: |
          # Use npm install with legacy peer deps to avoid failing on lockfile drift
          npm install --legacy-peer-deps
          npm run build
          # GitHub Pages SPA fallback for deep links (e.g. /notes, /favorites)
          if [ -f "build/index.html" ]; then cp build/index.html build/404.html; fi
          if [ -f "dist/index.html" ]; then cp dist/index.html dist/404.html; fi

      - id: determine_dir
        name: Determine publish directory
        run: |
          if [ -d "my-app/build" ]; then echo "dir=my-app/build" >> $GITHUB_OUTPUT; 
          elif [ -d "my-app/dist" ]; then echo "dir=my-app/dist" >> $GITHUB_OUTPUT; 
          else echo "dir=my-app/build" >> $GITHUB_OUTPUT; fi

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.determine_dir.outputs.dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
